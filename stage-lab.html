<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Roma - stage lab (dev only)</title>
<!-- Dev-only lab. Google Fonts is for this page only; the app self-hosts the same families via fontsource. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Cinzel:wght@400..900&family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&family=Reddit+Mono:wght@400..900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { background: #EADCC3; }
  body { margin: 0; font-family: "Familjen Grotesk", sans-serif; -webkit-font-smoothing: antialiased; }
  #root { width: min(430px, 100%); margin: 0 auto; background: #FAF5ED; min-height: 100dvh; padding: 24px 20px 40px; box-sizing: border-box; }
  .lab-bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; font: 600 11px/1 "Reddit Mono", monospace; letter-spacing: .06em; }
  .lab-bar a { padding: 6px 8px; border: 1px solid #92754F; border-radius: 999px; color: #6E5434; text-decoration: none; }
  .lab-bar a[aria-current="page"] { background: #9B2D1A; border-color: #9B2D1A; color: #FAF5ED; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/stage-lab.tsx"></script>
</body>
</html>
